<script type="module">
import { initializeApp } from 'firebase/app';
import { getFirestore, doc, setDoc, getDoc, getDocs, updateDoc, collection, increment } from 'firebase/firestore';
const cfg={apiKey:"AIzaSyDHeEUSDBLkVbJOYI4OwaG2qTZRosc049M",authDomain:"zuffaucet.firebaseapp.com",projectId:"zuffaucet",storageBucket:"zuffaucet.firebasestorage.app",messagingSenderId:"884207720462",appId:"1:884207720462:web:fb00900a2fd84e78d0045f",measurementId:"G-GD4TCL7Z41"};
const app=initializeApp(cfg); const db=getFirestore(app);
window.doLogin=function(){ const e=document.getElementById('email').value; const p=document.getElementById('pass').value; if(e==='admin@zuffaucet.com'&&p==='zuff2024'){ document.getElementById('login').style.display='none'; document.getElementById('app').style.display='block'; loadAll(); } else { document.getElementById('loginMsg').innerHTML='<div class=error>Zlé heslo</div>'; } };
window.loadAll=async function(){
 try{
  const bankRef=doc(db,'bank','main'); const snap=await getDoc(bankRef);
  if(!snap.exists()){ await setDoc(bankRef,{balance:0,totalProfit:0,aadsEarnings:0}); document.getElementById('bankBal').textContent=0; document.getElementById('bankUsd').textContent='0'; document.getElementById('bankProfit').textContent=0; }
  else{ const d=snap.data(); document.getElementById('bankBal').textContent=d.balance||0; document.getElementById('bankUsd').textContent=((d.balance||0)*0.00001).toFixed(4); document.getElementById('bankProfit').textContent=d.totalProfit||0; }
  const usersSnap=await getDocs(collection(db,'users')); document.getElementById('usersCount').innerHTML='Počet: '+usersSnap.size; const body=document.getElementById('usersBody'); body.innerHTML=''; usersSnap.forEach(docSnap=>{ const d=docSnap.data(); const tr=document.createElement('tr'); tr.innerHTML=`<td>${d.username||docSnap.id}</td><td>${d.email||''}</td><td>${d.coins||0} ($${((d.coins||0)*0.00001).toFixed(4)})</td><td>${d.ptcDone||0}</td><td>${d.totalProfitGenerated||0}</td>`; body.appendChild(tr); });
  const wdSnap=await getDocs(collection(db,'withdrawals')); const wdList=document.getElementById('wdList'); wdList.innerHTML=''; wdSnap.forEach(w=>{ const d=w.data(); if(d.status==='pending'){ const div=document.createElement('div'); div.style.cssText='border:1px solid rgba(255,255,255,0.1);padding:10px;border-radius:8px;margin:6px 0;display:flex;justify-content:space-between'; div.innerHTML=`<div>${d.username} - ${d.coins} Coins ($${d.usd}) - ${d.method} - ${d.address}</div><div><button class=btn onclick="approve('${w.id}','${d.username}',${d.coins})">Schváliť</button></div>`; wdList.appendChild(div); } });
  document.getElementById('debug').innerHTML='<div class=success>Firestore OK - users:'+usersSnap.size+' withdrawals:'+wdSnap.size+'</div>';
 }catch(e){ document.getElementById('debug').innerHTML='<div class=error>'+e.message+'</div>'; console.error(e); }
};
window.addMoney=async function(){ try{ const ref=doc(db,'bank','main'); await updateDoc(ref,{balance:increment(1000),totalProfit:increment(1000)}); loadAll(); }catch(e){ await setDoc(doc(db,'bank','main'),{balance:1000,totalProfit:1000,aadsEarnings:0}); loadAll(); } };
window.approve=async function(wdId,username,coins){ try{ const userRef=doc(db,'users',username); const userSnap=await getDoc(userRef); if(userSnap.exists()){ const cur=userSnap.data().coins||0; if(cur>=coins){ await updateDoc(userRef,{coins:increment(-coins)}); await updateDoc(doc(db,'bank','main'),{balance:increment(-coins)}); await updateDoc(doc(db,'withdrawals',wdId),{status:'approved'}); alert('Schválené - odpočítané'); loadAll(); } else { alert('Má málo coins: '+cur); } } }catch(e){ alert('Err '+e.message); } };
</script>
