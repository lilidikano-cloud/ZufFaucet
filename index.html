<style>body{margin:0;background:#0a0f1e;color:#fff;font-family:monospace}.container{max-width:900px;margin:0 auto;padding:16px}.card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:14px;padding:16px;margin-bottom:12px}.btn{background:#00e5ff;color:#000;padding:12px;border-radius:10px;border:none;font-weight:bold;width:100%;cursor:pointer}input,select{width:100%;padding:11px;border-radius:8px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.2);color:#fff;margin:5px 0 10px;box-sizing:border-box}.err{background:rgba(255,60,60,0.15);border:1px solid rgba(255,60,60,0.4);padding:10px;border-radius:8px;font-size:12px;margin:8px 0}.ok{background:rgba(60,255,120,0.15);border:1px solid rgba(60,255,120,0.4);padding:10px;border-radius:8px;font-size:12px;margin:8px 0}.ptc{display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:10px;margin:6px 0}</style>
</head><body>
<div class="container">
<h2>ZUFFAUCET <span style="color:#00e5ff">REAL FIRESTORE</span></h2>
<div id="status">Loading Firebase...</div>
<div id="auth" class="card">
<input id="u" placeholder="Username tomas09i"><input id="e" placeholder="Email zanetpazur@gmail.com">
<button class="btn" id="btnReg">Create in Firestore POST</button>
<div id="am"></div>

<div class="card"><h3>Faucet 50 Coins / 20min</h3><label><input type="checkbox" id="chk" style="width:auto"> Not robot</label><br><br>Math <span id="mq">3+5</span> = ? <input id="ma" style="width:60px;display:inline"> <br><br><button class="btn" id="btnF">Claim 50</button><div id="fm"></div><div id="tm"></div></div>

<script>
const firebaseConfig={apiKey:"AIzaSyDHeEUSDBLkVbJOYI4OwaG2qTZRosc049M",authDomain:"zuffaucet.firebaseapp.com",projectId:"zuffaucet",storageBucket:"zuffaucet.firebasestorage.app",messagingSenderId:"884207720462",appId:"1:884207720462:web:fb00900a2fd84e78d0045f"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
document.getElementById('status').innerHTML='<div class=ok>Firebase connected - project zuffaucet - REAL SDK</div>';
let cur=null; let a=3,b=5; function newM(){a=Math.floor(Math.random()*9)+1;b=Math.floor(Math.random()*9)+1;document.getElementById('mq').textContent=a+'+'+b;} newM();
function chkOk(){const c=document.getElementById('chk').checked; const an=parseInt(document.getElementById('ma').value); document.getElementById('btnF').disabled=!(c&&an===a+b);}
document.getElementById('chk').addEventListener('change',chkOk); document.getElementById('ma').addEventListener('input',chkOk); chkOk();
const PTC=[{t:'Binance Trade',tot:250},{t:'Ledger Wallet',tot:200},{t:'CMC Track',tot:175},{t:'Bybit Launch',tot:150},{t:'Trust Wallet',tot:125},{t:'Learn Staking',tot:100},{t:'Faucet List',tot:75}];
function rew(t){return Math.floor(t*0.4);}
function render(){const l=document.getElementById('ptcList');l.innerHTML='';[...PTC].sort((x,y)=>rew(y.tot)-rew(x.tot)).forEach(p=>{const r=rew(p.tot);const d=document.createElement('div');d.className='ptc';d.innerHTML=`<div><b>${p.t}</b><br><span style="font-size:11px;opacity:0.6">You will get ${r} Coins</span></div><button class=btn style="width:auto;padding:6px 10px" onclick="doPTC(${r},${p.tot},this)">Watch</button>`;l.appendChild(d);});}render();
window.doPTC=function(r,tot,btn){if(!cur){alert('login');return;}btn.textContent='Watching 5s...';btn.disabled=true;let t=5;const iv=setInterval(()=>{t--;btn.textContent='Watching '+t+'s...';if(t<=0){clearInterval(iv);finish(r,tot,btn);}},1000);};
async function finish(r,tot,btn){try{const ref=db.collection('users').doc(cur);await ref.update({coins:firebase.firestore.FieldValue.increment(r),ptcDone:firebase.firestore.FieldValue.increment(1),totalProfitGenerated:firebase.firestore.FieldValue.increment(Math.floor(tot*0.6))});const bRef=db.collection('bank').doc('main');const s=await bRef.get();if(!s.exists) await bRef.set({balance:0,totalProfit:0,aadsEarnings:0});await bRef.update({totalProfit:firebase.firestore.FieldValue.increment(Math.floor(tot*0.6)),balance:firebase.firestore.FieldValue.increment(Math.floor(tot*0.6))});btn.textContent='Done +'+r;load();}catch(e){alert('PTC '+e.message);btn.textContent='Error';}}
async function load(){if(!cur)return;const snap=await db.collection('users').doc(cur).get();if(snap.exists){const d=snap.data();document.getElementById('bal').textContent=d.coins||0;document.getElementById('balUsd').textContent=((d.coins||0)*0.00001).toFixed(4);document.getElementById('ptc').textContent=d.ptcDone||0;const last=d.faucetLast||0;const diff=Date.now()-last;const twenty=20*60*1000;if(diff<twenty){const left=Math.ceil((twenty-diff)/1000);document.getElementById('tm').textContent='Wait '+left+'s';document.getElementById('btnF').disabled=true;}else{document.getElementById('tm').textContent='Ready';chkOk();}}}
document.getElementById('btnReg').onclick=async()=>{const u=document.getElementById('u').value.trim().toLowerCase();const e=document.getElementById('e').value.trim();if(!u||!e){document.getElementById('am').innerHTML='<div class=err>Fill</div>';return;}try{document.getElementById('am').innerHTML='Creating...';const ref=db.collection('users').doc(u);const snap=await ref.get();if(snap.exists){cur=u;document.getElementById('auth').style.display='none';document.getElementById('app').style.display='block';load();}else{await ref.set({username:u,email:e,coins:0,ptcDone:0,shortDone:0,level:1,faucetLast:0,totalProfitGenerated:0,createdAt:firebase.firestore.FieldValue.serverTimestamp()});cur=u;document.getElementById('auth').style.display='none';document.getElementById('app').style.display='block';load();}}catch(err){document.getElementById('am').innerHTML='<div class=err>Failed to create user. Check Firestore error below.</div><div style="margin-top:6px;padding:8px;background:rgba(0,0,0,0.3);border-radius:6px;font-size:10px">FIRESTORE REST ERROR<br>Failed to fetch<br>'+err.code+'<br>'+err.message+'</div>';console.error(err);}};
document.getElementById('btnF').onclick=async()=>{try{const ref=db.collection('users').doc(cur);const snap=await ref.get();const d=snap.data();if(Date.now()-(d.faucetLast||0) < 20*60*1000){alert('wait');return;}await ref.update({coins:firebase.firestore.FieldValue.increment(50),faucetLast:Date.now()});document.getElementById('fm').innerHTML='<div class=ok>+50</div>';newM();document.getElementById('ma').value='';document.getElementById('chk').checked=false;chkOk();load();}catch(e){document.getElementById('fm').innerHTML='<div class=err>'+e.message+'</div>';}};
document.getElementById('btnW').onclick=async()=>{const amt=parseInt(document.getElementById('wa').value);const meth=document.getElementById('wm').value;const addr=document.getElementById('waddr').value.trim();if(!amt||amt<1000){document.getElementById('wmsg').innerHTML='<div class=err>Min 1000</div>';return;}if(!addr){document.getElementById('wmsg').innerHTML='<div class=err>Enter addr</div>';return;}try{await db.collection('withdrawals').add({username:cur,coins:amt,usd:amt*0.00001,method:meth,address:addr,status:'pending',date:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById('wmsg').innerHTML='<div class=ok>Withdraw pending</div>';}catch(e){document.getElementById('wmsg').innerHTML='<div class=err>'+e.message+'</div>';}};
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
